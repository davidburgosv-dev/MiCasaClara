<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f47"><title>MiCasa Clara | Prototipo de interacción</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17323b;background:#edf3f4;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #dd7e17;outline-offset:3px}#app{max-width:470px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 1px 20px #18374020}.top{padding:21px 22px 17px;background:#123f47;color:#fff}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand strong{font-size:1.24rem}.sub{font-size:.86rem;color:#d4e8e9}.badge{border-radius:100px;font-size:.78rem;padding:4px 9px;background:#d9f2e9;color:#164835;font-weight:700}.main{padding:24px 20px 104px}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#3c696e;font-weight:800}h1{font-size:1.75rem;letter-spacing:-.025em;line-height:1.17;margin:9px 0 10px}h2{font-size:1.24rem;margin:6px 0 14px}p{line-height:1.55;color:#47616a;margin:0 0 16px}.card{border:1.5px solid #d1dfe1;border-radius:16px;background:#fff;padding:17px;box-shadow:0 3px 8px #1033390b}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}.choice{background:#fff;border:2px solid #cbdadd;border-radius:14px;padding:17px 8px;text-align:center;min-height:95px;color:#17323b;font-weight:700}.choice .emoji{display:block;font-size:1.8rem;margin-bottom:6px}.choice[aria-pressed="true"]{border-color:#126d75;background:#e4f5f2}.btn{width:100%;border:0;border-radius:13px;min-height:49px;padding:12px 16px;background:#146c74;color:#fff;font-weight:750}.btn:disabled{background:#91a8aa;color:#152f31;cursor:not-allowed}.btn.secondary{background:#eef4f5;color:#174750;border:1px solid #b4cacf}.btn.danger{background:#fff2f0;color:#9b2319;border:1px solid #eac2be}.actions{display:flex;gap:10px;margin-top:24px}.actions .btn{flex:1}label{font-weight:750;display:block;margin:18px 0 7px}input,textarea,select{display:block;width:100%;min-height:46px;border:1.5px solid #9bb5b9;border-radius:10px;padding:11px;color:#163139;background:#fff}textarea{min-height:110px;resize:vertical}.hint{font-size:.86rem;color:#4d6570;margin-top:5px}.error{color:#ad2424;font-weight:700;min-height:22px} .progress{display:flex;gap:5px;margin:15px 0 24px}.progress span{height:6px;flex:1;background:#dce7e8;border-radius:8px}.progress span.on{background:#146c74}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;background:#fff;border-top:1px solid #dae5e7;display:flex;justify-content:space-around;padding:11px 8px env(safe-area-inset-bottom)}.footer button{border:0;background:transparent;font-weight:750;color:#38565f;min-width:90px;min-height:44px}.footer button.active{color:#09646b;border-bottom:3px solid #09646b}.notice{background:#fff8e6;border:1px solid #e4c87f;border-radius:12px;padding:13px;font-size:.87rem;color:#66491f;margin:15px 0}.list{display:grid;gap:11px}.item{width:100%;text-align:left;background:#fff;border:1px solid #cbdcde;border-radius:13px;padding:15px;color:#17323b}.meta{font-size:.87rem;color:#49626c;margin-top:7px}.status{display:inline-block;background:#e7effd;color:#234a79;font-size:.79rem;font-weight:750;border-radius:25px;padding:5px 9px}.empty{text-align:center;padding:36px 10px;border:2px dashed #c3d8db;border-radius:17px}.icon{font-size:2.25rem;display:block;margin-bottom:12px}.summary{margin:10px 0 20px}.summary dt{font-size:.83rem;color:#556d76}.summary dd{margin:2px 0 15px;font-weight:650;overflow-wrap:anywhere}.line{border:0;border-top:1px solid #dce7e9;margin:20px 0}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:.82rem}.hide{display:none!important}@media(prefers-reduced-motion:no-preference){.btn,.choice{transition:background .15s,border-color .15s}}@media(min-width:650px){body{padding:25px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
/* Controles, foco y lectura en pantallas estrechas */
html{scroll-padding-bottom:96px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline-color:#9a4c00}
h1:focus,#error:focus{outline:2px solid #9a4c00;outline-offset:3px}
h1,.item,.hint{overflow-wrap:anywhere}
input,textarea{border-color:#658288}
input::placeholder,textarea::placeholder{color:#526972;opacity:1}
[aria-invalid="true"]{border-color:#ad2424}
.choice,.item,.btn.secondary{border-color:#658288}
.choice[aria-pressed="true"]{border-color:#126d75}
.choice .selected{display:block;font-size:.82rem;margin-top:4px}
.choices{grid-template-columns:repeat(2,minmax(0,1fr))}
#photo::file-selector-button{min-height:44px}
.footer button{flex:1;min-width:0;min-height:44px;padding:4px;overflow-wrap:anywhere}
.footer{padding-bottom:max(8px,env(safe-area-inset-bottom))}
.error:not(:empty){margin-top:8px}
.error:empty{margin:0;min-height:0}
@media(max-height:420px){html{scroll-padding-bottom:0}.footer{position:static;transform:none}.main{padding-bottom:28px}}
</style>
</head>
<body><div id="app"><header class="top"><div class="brand"><strong>⌂ MiCasa Clara</strong><span style="font-size:.8rem">PROTOTIPO</span></div><div class="sub">Tus observaciones, en un lugar claro</div></header><main class="main" id="main" tabindex="-1"></main><nav class="footer" aria-label="Navegación principal"><button data-nav="home" class="active"><span aria-hidden="true">⌂</span> Inicio</button><button data-nav="records"><span aria-hidden="true">☷</span> Mis registros</button><button data-nav="help"><span aria-hidden="true">ⓘ</span> Ayuda</button></nav></div>
<script>
'use strict';
const KEY='micasa_clara_v1';const rooms=[['Baño','🚿'],['Cocina','🍳'],['Dormitorio','🛏️'],['Sala de estar','🛋️'],['Patio / exterior','🌿'],['Otro espacio','🏠']];
let records=[];try{let d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))records=d.filter(x=>x&&typeof x==='object')}catch(e){};
let page='home',step=1,viewId=null,form={room:'',title:'',description:'',location:'',photoName:''};const main=document.querySelector('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){return false}};
function focusPage(){
  window.scrollTo(0,0);
  const heading=main.querySelector('h1');
  const target=heading||main;
  target.setAttribute('tabindex','-1');
  target.focus({preventScroll:true});
}
function hasDraft(){return page==='wizard'&&Object.values(form).some(value=>value.length>0)}
function mayLeave(){
  if(page!=='wizard')return true;
  capture();
  return !hasDraft()||confirm('Tienes una observación sin guardar. Si sales, perderás lo ingresado. ¿Quieres descartarla y salir?');
}
function go(next){
  if(next===page)return;
  if(!mayLeave())return;
  page=next;render();focusPage();
}
// La advertencia del navegador protege ante recargas y cierre cuando está disponible.
window.addEventListener('beforeunload',event=>{
  if(page!=='wizard')return;
  capture();
  if(hasDraft()){event.preventDefault();event.returnValue=''}
});
function start(){form={room:'',title:'',description:'',location:'',photoName:''};step=1;go('wizard')}
function progress(){return '<div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="'+step+'" aria-label="Avance del registro" aria-valuetext="Paso '+step+' de 4">'+[1,2,3,4].map(n=>'<span class="'+(n<=step?'on':'')+'"></span>').join('')+'</div>'}
function setnav(){document.querySelectorAll('[data-nav]').forEach(b=>{let is=b.dataset.nav===page||page==='wizard'&&b.dataset.nav==='home'||page==='detail'&&b.dataset.nav==='records';b.classList.toggle('active',is);if(is)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function render(){setnav();if(page==='home')main.innerHTML=`<div class="eyebrow">Bienvenido</div><h1>Registra problemas de tu vivienda sin complicaciones.</h1><p>Organiza tus observaciones por habitación y revisa lo que registraste, paso a paso.</p><div class="card"><span class="icon" aria-hidden="true">📋</span><h2>¿Encontraste un problema?</h2><p>Te ayudaremos a describirlo en cuatro pasos sencillos.</p><button class="btn" id="start">+ Registrar problema</button></div><div class="notice"><strong>Importante:</strong> versión demostrativa. Tus registros se guardan únicamente en este navegador. No se envían a una empresa ni representan solicitudes de reparación oficiales.</div><button class="btn secondary" id="all">Ver mis registros (${records.length})</button>`;
else if(page==='wizard')drawWizard();else if(page==='records')main.innerHTML=`<div class="eyebrow">Seguimiento local</div><h1>Mis registros</h1><p>Observaciones guardadas en este dispositivo. El estado es de organización personal, no de una empresa constructora.</p>${records.length?'<div class="list">'+records.slice().reverse().map(r=>`<button class="item" data-view="${esc(r.id)}"><strong>${esc(r.title)}</strong><div class="meta">${esc(r.room)} · ${esc(r.date)}</div><div class="meta"><span class="status">${esc(r.status||'Registrado localmente')}</span></div></button>`).join('')+'</div>':'<div class="empty"><span class="icon" aria-hidden="true">📭</span><h2>Aún no tienes registros</h2><p>Cuando agregues un problema, aparecerá aquí.</p><button class="btn" id="start">Crear mi primer registro</button></div>'}<div style="height:20px"></div><button class="btn secondary" id="export" ${records.length?'':'disabled'}>Exportar mis registros (JSON)</button>`;
else if(page==='detail'){let r=records.find(x=>x.id===viewId);main.innerHTML=r?`<div class="eyebrow">Detalle de observación</div><h1>${esc(r.title)}</h1><span class="status">${esc(r.status||'Registrado localmente')}</span><dl class="summary"><dt>Habitación</dt><dd>${esc(r.room)}</dd><dt>Ubicación exacta</dt><dd>${esc(r.location||'No especificada')}</dd><dt>Descripción</dt><dd style="font-weight:400;white-space:pre-wrap">${esc(r.description)}</dd><dt>Fotografía</dt><dd>${r.photoName?'Archivo seleccionado: '+esc(r.photoName)+' (imagen no almacenada)':'No adjuntada'}</dd><dt>Fecha de registro</dt><dd>${esc(r.date)}</dd></dl><hr class="line"><div class="notice">El prototipo no envía solicitudes ni actualiza estados desde una constructora.</div><button class="btn danger" id="remove">Eliminar este registro</button><div style="height:12px"></div><button class="btn secondary" id="back">Volver a mis registros</button>`:'<h1>Registro no encontrado</h1><button class="btn" id="back">Volver</button>'}
else if(page==='success')main.innerHTML=`<div class="empty"><span class="icon" aria-hidden="true">✅</span><h1>Observación guardada</h1><p>Tu registro quedó guardado en este navegador. Puedes consultarlo en “Mis registros”.</p><button class="btn" id="all">Ver mis registros</button><div style="height:11px"></div><button class="btn secondary" id="start">Registrar otro problema</button></div>`;
else main.innerHTML=`<div class="eyebrow">Ayuda</div><h1>¿Cómo funciona MiCasa Clara?</h1><div class="card"><h2>Cuatro pasos</h2><ol><li>Selecciona la habitación.</li><li>Describe qué sucede y dónde.</li><li>Si quieres, selecciona una fotografía para guardar su nombre.</li><li>Revisa la información y guarda.</li></ol><p class="small">Navega usando teclado, botones grandes y textos claros. Puedes regresar antes de guardar. Si falta información obligatoria verás un aviso con lo que debes corregir.</p></div><div class="notice">Privacidad: los textos se almacenan en el almacenamiento local del navegador. Las fotografías NO se guardan ni se envían. Para este prototipo no ingreses datos personales sensibles.</div><button class="btn" id="start">Registrar problema</button>`;
wire()}
function drawWizard(){let body='';if(step===1)body=`<div class="eyebrow">Paso 1 de 4</div><h1>¿Dónde está el problema?</h1><p>Selecciona la habitación o espacio de tu vivienda.</p><div class="choices">${rooms.map(([room,icon])=>`<button type="button" class="choice" aria-pressed="${form.room===room}" data-room="${esc(room)}"><span class="emoji" aria-hidden="true">${icon}</span>${esc(room)}${form.room===room?'<span class="selected" aria-hidden="true">✓ Seleccionada</span>':''}</button>`).join('')}</div>`;
if(step===2)body=`<div class="eyebrow">Paso 2 de 4</div><div class="eyebrow" id="room-context">Habitación: ${esc(form.room)}</div><h1 aria-describedby="room-context">Cuéntanos qué observaste</h1><p>Completa los campos marcados con *. No necesitas usar palabras técnicas.</p><label for="title">Nombre breve del problema <span aria-hidden="true">*</span></label><input id="title" maxlength="80" aria-describedby="title-hint" value="${esc(form.title)}" placeholder="Ej.: llave del lavamanos gotea" required><div class="hint" id="title-hint">Hasta 80 caracteres.</div><label for="location">¿En qué parte exacta? (opcional)</label><input id="location" maxlength="100" value="${esc(form.location)}" placeholder="Ej.: debajo del lavamanos"><label for="description">Describe lo que ocurre <span aria-hidden="true">*</span></label><textarea id="description" maxlength="800" aria-describedby="description-hint" placeholder="Ej.: se forma una gota de agua cada pocos segundos" required>${esc(form.description)}</textarea><div class="hint" id="description-hint">Hasta 800 caracteres. Describe lo que ves.</div>`;
if(step===3)body=`<div class="eyebrow">Paso 3 de 4</div><div class="eyebrow" id="room-context">Habitación: ${esc(form.room)}</div><h1 aria-describedby="room-context">¿Tienes una fotografía?</h1><p>Es opcional. La imagen no se guardará en este prototipo; solo se conservará su nombre junto al registro local.</p><label for="photo">Seleccionar imagen (opcional; no se guarda)</label><input id="photo" type="file" accept="image/*"><div class="hint" id="filename" role="status">${form.photoName?'Seleccionada: '+esc(form.photoName):'Puedes continuar sin adjuntar una imagen.'}</div>`;
if(step===4)body=`<div class="eyebrow">Paso 4 de 4</div><div class="eyebrow" id="room-context">Habitación: ${esc(form.room)}</div><h1 aria-describedby="room-context">Revisa antes de guardar</h1><p>Comprueba que la información represente correctamente lo que observaste.</p><dl class="summary"><dt>Habitación</dt><dd>${esc(form.room)}</dd><dt>Problema</dt><dd>${esc(form.title)}</dd><dt>Ubicación</dt><dd>${esc(form.location||'No especificada')}</dd><dt>Descripción</dt><dd style="white-space:pre-wrap">${esc(form.description)}</dd><dt>Foto</dt><dd>${esc(form.photoName||'No seleccionada')}</dd></dl><div class="notice">Al guardar, se creará una observación local. No se enviará a una constructora.</div>`;
main.innerHTML=progress()+body+`<p class="error" id="error" role="alert"></p><div class="actions"><button class="btn secondary" id="prev">${step===1?'Cancelar':'Atrás'}</button><button class="btn" id="next">${step===4?'Guardar registro':'Continuar'}</button></div>`}
function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.querySelectorAll('#start').forEach(b=>b.onclick=start);document.querySelectorAll('#all,#back').forEach(b=>b.onclick=()=>go('records'));document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{form.room=b.dataset.room;drawWizard();wire();document.querySelector('[data-room="'+CSS.escape(form.room)+'"]').focus()});let prev=document.querySelector('#prev'),next=document.querySelector('#next');if(prev)prev.onclick=()=>{if(step===1)go('home');else{capture();step--;render();focusPage()}};if(next)next.onclick=()=>{capture();if(step===1&&!form.room){
  showError('Selecciona una habitación para continuar.');
  return;
}
if(step===2){
  const fields=['title','description'];
  const missing=fields.filter(id=>!form[id].trim());
  fields.forEach(id=>{
    const control=document.getElementById(id);
    const invalid=missing.includes(id);
    control.setAttribute('aria-invalid',String(invalid));
    control.setAttribute('aria-describedby',id+'-hint'+(invalid?' error':''));
  });
  if(missing.length){
    const message=missing.length===2?'Escribe un nombre y una descripción del problema.':
      missing[0]==='title'?'Escribe un nombre para el problema.':'Describe lo que ocurre.';
    showError(message);
    return;
  }
}
if(step<4){step++;render();focusPage();return}const id=String(Date.now())+'-'+Math.random().toString(36).slice(2,6);const date=new Date().toLocaleDateString('es-CL');records.push({...form,id,date,status:'Registrado localmente'});if(save()){page='success';render();focusPage()}else{records.pop();showError('No se pudo guardar. Comprueba que el navegador permita guardar datos y vuelve a intentarlo. Tu información sigue en el formulario.')}};
let photo=document.querySelector('#photo');if(photo)photo.onchange=()=>{form.photoName=photo.files?.[0]?.name||'';document.querySelector('#filename').textContent=form.photoName?'Seleccionada: '+form.photoName:'Puedes continuar sin adjuntar una imagen.'};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewId=b.dataset.view;go('detail')});let remove=document.querySelector('#remove');if(remove)remove.onclick=()=>{if(confirm('¿Eliminar definitivamente esta observación de este navegador?')){let old=records;records=records.filter(r=>r.id!==viewId);if(!save()){records=old;alert('No fue posible eliminar el registro.')}else go('records')}};let ex=document.querySelector('#export');if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='micasa-clara-registros.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function showError(message){
  const error=document.querySelector('#error');
  error.textContent=message;
  error.setAttribute('tabindex','-1');
  error.focus();
}
function capture(){const title=document.querySelector('#title'),loc=document.querySelector('#location'),desc=document.querySelector('#description');if(title)form.title=title.value;if(loc)form.location=loc.value;if(desc)form.description=desc.value}
render();
</script></body></html>
